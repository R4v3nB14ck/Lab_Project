<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Lab_Project_Files</title>
	<style>
		html, body {
			background: black;
			width: 100%; height: 100%;
			overflow: hidden; padding: 0; margin: 0;
		}

		div#gameContainer {
			width: 100%; height: 100%;
			display: flex; align-items: center; justify-content: center;
		}

		canvas {
			width: 100%; height: 100%;
			object-fit: contain; /* Esto asegura el 16:9 sin deformar */
		}

		/* Botón discreto arriba a la derecha */
		#fullscreen-button {
			position: absolute;
			top: 10px; right: 10px;
			width: 40px; height: 40px;
			background: rgba(0, 0, 0, 0.3);
			border-radius: 50%;
			cursor: pointer;
			z-index: 1000;
			display: flex; align-items: center; justify-content: center;
			border: 1px solid rgba(255, 255, 255, 0.2);
			transition: opacity 0.3s;
			opacity: 0.5;
		}
		#fullscreen-button:hover { opacity: 1; }
		#fullscreen-button svg { width: 20px; height: 20px; fill: white; }
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" data-pixel-art="false"></canvas>
		<button id="fullscreen-button">
			<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
		</button>
	</div>

	<script src="Build/Lab_Project.loader.js"></script>
	<script>
		var canvas = document.querySelector("#unity-canvas");
		var container = document.querySelector("#gameContainer");
		var config = {
			dataUrl: "Build/Lab_Project.data.unityweb",
			frameworkUrl: "Build/Lab_Project.framework.js.unityweb",
			codeUrl: "Build/Lab_Project.wasm.unityweb",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "R4v3nB14ck",
			productName: "Lab_Project_Files",
			productVersion: "0.1",
		};

		// Barra de carga nativa del template
		function progressHandler(progress) {
			var percent = progress * 100 + '%';
			canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
			canvas.style.backgroundSize = '100% 0.5rem';
		}

		createUnityInstance(canvas, config, progressHandler).then((instance) => {
			canvas.style.background = 'none'; // Quitar barra al terminar
		});

		// Lógica de fullscreen y rotación
		const fsBtn = document.getElementById('fullscreen-button');
		async function toggleFS() {
			if (!document.fullscreenElement) {
				await container.requestFullscreen().catch(e => console.log(e));
				if (screen.orientation) await screen.orientation.lock('landscape').catch(e => {});
			} else {
				await document.exitFullscreen();
			}
		}
		fsBtn.onclick = toggleFS;

		window.addEventListener("orientationchange", () => {
			if (window.innerWidth > window.innerHeight && !document.fullscreenElement) {
				toggleFS();
			}
		});

		// Optimización de performance: Evitar cálculos innecesarios
		// El uso de CSS "object-fit: contain" es mucho más rápido para el navegador 
		// que calcular el tamaño manualmente con JS.
	</script>
</body>
</html>
