<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Lab_Project_Files</title>
	<style>
		html,
		body {
			background: black;
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
			font-family: sans-serif;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
			-webkit-user-select: none;
			user-select: none;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: pixelated;
		}

		/* Botón de Pantalla Completa elegante */
		#fullscreen-button {
			position: fixed;
			bottom: 20px;
			right: 20px;
			width: 50px;
			height: 50px;
			background: rgba(0, 0, 0, 0.5);
			border-radius: 50%;
			cursor: pointer;
			z-index: 1000;
			display: flex;
			align-items: center;
			justify-content: center;
			border: 2px solid rgba(255, 255, 255, 0.3);
			transition: all 0.3s;
			backdrop-filter: blur(5px);
		}

		#fullscreen-button:hover {
			background: rgba(0, 0, 0, 0.8);
			transform: scale(1.1);
		}

		#fullscreen-button svg {
			width: 25px;
			height: 25px;
			fill: white;
		}
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="1280" height="720" data-pixel-art="false"></canvas>
		
		<button id="fullscreen-button" title="Pantalla completa">
			<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
		</button>

		<script src="Build/Lab_Project.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var container = document.querySelector("#gameContainer");
			var fullscreenButton = document.querySelector("#fullscreen-button");
			
			var config = {
				dataUrl: "Build/Lab_Project.data.unityweb",
				frameworkUrl: "Build/Lab_Project.framework.js.unityweb",
				codeUrl: "Build/Lab_Project.wasm.unityweb",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "R4v3nB14ck",
				productName: "Lab_Project_Files",
				productVersion: "0.1",
				autoSyncPersistentDataPath: true,
			};

			var scaleToFit = true;

			function onResize() {
				var w = window.innerWidth;
				var h = window.innerHeight;
				var r = 720 / 1280;

				if (w * r > window.innerHeight) {
					w = Math.min(w, Math.ceil(h / r));
				}
				h = Math.floor(w * r);

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
			}

			createUnityInstance(canvas, config, (p) => {}).then((instance) => {
				onResize();
			});

			window.addEventListener('resize', onResize);

			// --- LÓGICA DE FULLSCREEN Y ROTACIÓN ---
			
			async function toggleFullscreen() {
				if (!document.fullscreenElement) {
					try {
						await container.requestFullscreen();
						if (screen.orientation && screen.orientation.lock) {
							await screen.orientation.lock('landscape');
						}
					} catch (e) { console.error(e); }
				} else {
					if (document.exitFullscreen) await document.exitFullscreen();
				}
			}

			fullscreenButton.onclick = toggleFullscreen;

			// Detectar giro del dispositivo para activar fullscreen automáticamente
			window.addEventListener("orientationchange", () => {
				setTimeout(() => {
					if (window.innerWidth > window.innerHeight) {
						if (!document.fullscreenElement) {
							toggleFullscreen();
						}
					}
				}, 500);
			});

			// Configuración móvil
			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
	</div>
</body>
</html>
