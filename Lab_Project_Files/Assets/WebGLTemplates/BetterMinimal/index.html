<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>{{{ PRODUCT_NAME }}}</title>
	<style>
		html,
		body {
			background: {{{ BACKGROUND || '#000' }}};
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
			top: 0;
			left: 0;
		}

		div#gameContainer canvas {
			position: absolute;
			-webkit-user-select: none;
			user-select: none;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}

		/* Botón discreto arriba a la derecha */
		#fullscreen-button {
			position: absolute;
			top: 15px; right: 15px;
			width: 45px; height: 45px;
			background: rgba(0, 0, 0, 0.3);
			border-radius: 50%;
			cursor: pointer;
			z-index: 1000;
			display: flex; align-items: center; justify-content: center;
			border: 1px solid rgba(255, 255, 255, 0.2);
			transition: opacity 0.3s;
			opacity: 0.5;
		}
		#fullscreen-button:hover { opacity: 1; }
		#fullscreen-button svg { width: 24px; height: 24px; fill: white; }
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" data-pixel-art="{{{ OPTIMIZE_FOR_PIXEL_ART }}}"></canvas>
		<button id="fullscreen-button">
			<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
		</button>
		<script src="Build/{{{ LOADER_FILENAME }}}"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var config = {
				dataUrl: "Build/{{{ DATA_FILENAME }}}",
				frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
				codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
				memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
				symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
				streamingAssetsUrl: "StreamingAssets",
				companyName: "{{{ COMPANY_NAME }}}",
				productName: "{{{ PRODUCT_NAME }}}",
				productVersion: "{{{ PRODUCT_VERSION }}}",
				autoSyncPersistentDataPath: true,
			};

			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}

			// Siempre escala a pantalla completa (borde a borde), sin respetar el aspect ratio original.
			function onResize() {
				var container = canvas.parentElement;
				var w = window.innerWidth;
				var h = window.innerHeight;

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = "0px";
				container.style.left = "0px";
				window.focus();
			}

			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				canvas = instance.Module.canvas;
				onResize();
			});
			window.addEventListener('resize', onResize);
			onResize();

			// Lógica de fullscreen y orientación
			var fsButton = document.getElementById('fullscreen-button');

			function goFullscreen() {
				var elem = document.documentElement;
				if (elem.requestFullscreen) elem.requestFullscreen();
				else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function () {});
				}
			}
			fsButton.onclick = goFullscreen;

			function updateFsButton() {
				var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
				fsButton.style.display = isFullscreen ? 'none' : 'flex';
				onResize();
			}
			document.addEventListener('fullscreenchange', updateFsButton);
			document.addEventListener('webkitfullscreenchange', updateFsButton);

			// Si el usuario gira el teléfono con el bloqueo de rotación desactivado,
			// pasamos a pantalla completa automáticamente al quedar en horizontal.
			window.addEventListener('orientationchange', function () {
				setTimeout(function () {
					if (window.innerWidth > window.innerHeight && !document.fullscreenElement && !document.webkitFullscreenElement) {
						goFullscreen();
					}
				}, 500);
			});

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				// Mobile device style: fill the whole browser client area with the game canvas:
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
	</div>
</body>

</html>
