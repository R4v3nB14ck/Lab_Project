<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>{{{ PRODUCT_NAME }}}</title>
	<style>
		html,
		body {
			background: {{{ BACKGROUND || '#000' }}};
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
			font-family: sans-serif;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
			-webkit-user-select: none;
			user-select: none;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: pixelated;
		}

		/* Estilo del Botón de Pantalla Completa */
		#fullscreen-button {
			position: fixed;
			bottom: 20px;
			right: 20px;
			width: 50px;
			height: 50px;
			background: rgba(255, 255, 255, 0.5);
			border-radius: 8px;
			cursor: pointer;
			z-index: 100;
			display: flex;
			align-items: center;
			justify-content: center;
			border: none;
			transition: background 0.3s;
		}

		#fullscreen-button:hover {
			background: rgba(255, 255, 255, 0.8);
		}

		#fullscreen-button svg {
			width: 30px;
			height: 30px;
			fill: #333;
		}

		/* Aviso de rotación */
		#orientation-warning {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #000;
			color: white;
			z-index: 999;
			text-align: center;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		/* Solo mostrar aviso si es móvil y está en vertical */
		@media screen and (orientation: portrait) {
			.is-mobile #orientation-warning {
				display: flex;
			}
		}
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" data-pixel-art="{{{ OPTIMIZE_FOR_PIXEL_ART }}}"></canvas>
		
		<!-- Botón Fullscreen -->
		<button id="fullscreen-button" title="Fullscreen">
			<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
		</button>

		<!-- Aviso de rotación -->
		<div id="orientation-warning">
			<div style="font-size: 50px;">🔄</div>
			<p>Por favor, gira tu dispositivo a posición horizontal</p>
		</div>

		<script src="Build/{{{ LOADER_FILENAME }}}"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var container = document.querySelector("#gameContainer");
			var fullscreenButton = document.querySelector("#fullscreen-button");
			
			var config = {
				dataUrl: "Build/{{{ DATA_FILENAME }}}",
				frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
				codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
				memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
				symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
				streamingAssetsUrl: "StreamingAssets",
				companyName: "{{{ COMPANY_NAME }}}",
				productName: "{{{ PRODUCT_NAME }}}",
				productVersion: "{{{ PRODUCT_VERSION }}}",
				autoSyncPersistentDataPath: true,
			};

			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("{{{ SCALE_TO_FIT }}}");
			} catch (e) {
				scaleToFit = true;
			}

			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}

			function onResize() {
				var w, h;
				if (scaleToFit) {
					w = window.innerWidth;
					h = window.innerHeight;
					var r = {{{ HEIGHT }}} / {{{ WIDTH }}};
					if (w * r > window.innerHeight) {
						w = Math.min(w, Math.ceil(h / r));
					}
					h = Math.floor(w * r);
				} else {
					w = {{{ WIDTH }}};
					h = {{{ HEIGHT }}};
				}
				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
			}

			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				onResize();
			});

			window.addEventListener('resize', onResize);
			onResize();

			// Lógica para detectar móvil
			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				document.body.classList.add('is-mobile');
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}

			// --- LÓGICA DE FULLSCREEN Y ROTACIÓN ---
			fullscreenButton.onclick = () => {
				toggleFullscreen();
			};

			function toggleFullscreen() {
				if (!document.fullscreenElement) {
					// Entrar en Fullscreen
					if (container.requestFullscreen) {
						container.requestFullscreen().then(() => {
							lockOrientation();
						}).catch(err => {
							console.log("Error al intentar pantalla completa", err);
						});
					} else if (container.webkitRequestFullscreen) { /* Safari/iOS */
						container.webkitRequestFullscreen();
					}
				} else {
					// Salir de Fullscreen
					if (document.exitFullscreen) {
						document.exitFullscreen();
					}
				}
			}

			function lockOrientation() {
				// El Screen Orientation API solo funciona en algunos navegadores Android/Chrome
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function(error) {
						console.log("La rotación automática no es soportada o fue bloqueada: ", error);
					});
				}
			}

			// Ocultar botón si ya estamos en pantalla completa (opcional)
			document.addEventListener('fullscreenchange', () => {
				if (document.fullscreenElement) {
					fullscreenButton.style.display = 'none';
				} else {
					fullscreenButton.style.display = 'flex';
				}
				setTimeout(onResize, 100);
			});
		</script>
	</div>
</body>

</html>
